name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 */2 * *'  # Κάθε 2 μέρες
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase via PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -c "SELECT 1;" && echo "Supabase PostgreSQL ping successful!"

      - name: Ping Upstash Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          curl -s "$UPSTASH_REDIS_REST_URL/ping" \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            && echo " - Redis ping successful!"
